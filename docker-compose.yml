services:
  # Redis service for rate limiting backend.
  redis:
    image: redis:7-alpine
    container_name: celery-rate-limiter-redis
    # Disable RDB snapshots and AOF to suppress "DB saved on disk" log spam.
    # Note: data will NOT survive container restarts with this setting.
    command: redis-server --save "" --appendonly no
    ports:
      # Map to port 6380 by default to avoid conflicts with local Redis on 6379.
      # Override with REDIS_PORT environment variable if needed.
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      # Optional: persist Redis data.
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - rate-limiter-network

  # Celery worker service (production).
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: celery-rate-limiter-worker
    environment:
      # Configure Celery to use the docker-compose Redis.
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rate-limiter-network
    profiles:
      # Only start with: docker-compose --profile production up.
      - production

  # Test runner service (fast tests only, excludes @pytest.mark.slow).
  test:
    &test-base
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: celery-rate-limiter-test
    environment:
      # Tests will use docker-compose Redis instead of localhost.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
    volumes:
      # Mount source for live development.
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    depends_on:
      redis:
        condition: service_healthy
    command: poetry run pytest tests/ -v -s
    networks:
      - rate-limiter-network
    profiles:
      - test

  # Test runner service (all tests, including @pytest.mark.slow).
  test-all:
    <<: *test-base
    container_name: celery-rate-limiter-test-all
    command: poetry run pytest --override-ini='addopts=' tests/ -v -s
    profiles:
      - test-all

  # Mutation testing service (runs mutmut inside Docker; requires Linux fork support).
  mutate:
    <<: *test-base
    container_name: celery-rate-limiter-mutate
    volumes:
      # Output directory only; /app/mutants is mutmut's internal working directory.
      # Rebuild with --build to pick up source changes.
      - ./mutmut-results:/app/mutation-output
    command: >-
      bash -c "
        python scripts/run_mutmut.py run ||
          { echo '*** BASELINE FAILURE: mutmut run exited with code '$$?' ***';
            echo 'Re-running test suite to capture the failing test:';
            python -m pytest -x --tb=short -q
              --ignore=tests/properties/
              --deselect=tests/integration/test_rate_limiting.py::TestSlidingWindowBehavior
              --deselect=tests/integration/test_distributed_rate_limiting.py::TestDistributedRateLimiting;
            exit 1; };
        echo '--- MUTATION RESULTS ---';
        mutmut results | tee /app/mutation-output/results.txt;
        echo '--- SURVIVED, UNTESTED, SUSPICIOUS, AND TIMEOUT MUTATION DIFFS ---' > /app/mutation-output/diffs.txt;
        mutmut results | grep -E ': (survived|no tests|suspicious|timeout)' | sed 's/^[[:space:]]*//' | cut -d: -f1 | while read -r name; do
          echo \"=== $$name ===\" >> /app/mutation-output/diffs.txt;
          mutmut show \"$$name\" >> /app/mutation-output/diffs.txt 2>&1;
          echo '' >> /app/mutation-output/diffs.txt;
        done;
        echo '';
        echo '--- MUTANT CLASSIFICATION ---';
        python scripts/classify_mutants.py /app/mutation-output/diffs.txt | tee /app/mutation-output/classification.txt;
        cp mutants/mutmut-stats.json /app/mutation-output/stats.json 2>/dev/null || echo 'No stats file found'
      "
    profiles:
      - mutate

  # Optional: Redis Commander (web UI for debugging).
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: celery-rate-limiter-redis-ui
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rate-limiter-network
    profiles:
      # Only start with: docker-compose --profile debug up.
      - debug

volumes:
  redis-data:
    driver: local

networks:
  rate-limiter-network:
    driver: bridge
