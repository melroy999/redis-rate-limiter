services:
  # Redis service for rate limiting backend.
  redis:
    image: redis:7-alpine
    container_name: redis-rate-limiter-redis
    # Disable all persistence: no RDB snapshots, no loading existing dump.rdb, no AOF.
    command: redis-server --save "" --dbfilename "" --appendonly no
    ports:
      # Map to port 6380 by default to avoid conflicts with local Redis on 6379.
      # Override with REDIS_PORT environment variable if needed.
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - rate-limiter-network

  # Celery worker service (production).
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: redis-rate-limiter-worker
    environment:
      # Configure Celery to use the docker-compose Redis.
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rate-limiter-network
    profiles:
      # Only start with: docker-compose --profile production up.
      - production

  # Test runner service (fast tests only, excludes @pytest.mark.slow).
  test:
    &test-base
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: redis-rate-limiter-test
    environment:
      # Tests will use docker-compose Redis instead of localhost.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
    volumes:
      # Mount source for live development.
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    depends_on:
      redis:
        condition: service_healthy
    command: poetry run pytest tests/ -v -s
    networks:
      - rate-limiter-network
    profiles:
      - test

  # Test runner service (all tests, including @pytest.mark.slow).
  test-all:
    <<: *test-base
    container_name: redis-rate-limiter-test-all
    command: poetry run pytest --override-ini='addopts=--import-mode=importlib' tests/ -v -s
    profiles:
      - test-all

  # Mutation testing service (runs mutmut inside Docker; requires Linux fork support).
  mutate:
    <<: *test-base
    container_name: redis-rate-limiter-mutate
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
    volumes:
      # Rebuild with --build to pick up source changes.
      - ./mutmut-results:/app/mutation-output
      - ./mutants:/app/mutants
    command: >-
      bash -c "
        find /app/mutants -mindepth 1 -delete;
        python scripts/run_mutmut.py run --max-children $$(( $$(nproc) - 4 )) 2>&1 | tee /tmp/mutmut-run.log;
        MUTMUT_EXIT=$${PIPESTATUS[0]};
        if [ $$MUTMUT_EXIT -ne 0 ]; then
          echo '*** BASELINE FAILURE: mutmut run exited with code '$$MUTMUT_EXIT' ***';
          echo 'Re-running test suite to capture the failing test:';
          python -m pytest -x --tb=short -q --ignore=tests/properties/ --deselect=tests/integration/test_rate_limiting.py::TestSlidingWindowBehavior --deselect=tests/integration/test_distributed_rate_limiting.py::TestDistributedRateLimiting;
          exit 1;
        fi;
        python scripts/generate_mutmut_report.py --log /tmp/mutmut-run.log --output-dir /app/mutation-output --killed-by /tmp/mutmut_killed_by_results.json
      "
    profiles:
      - mutate

  # Mutation testing with per-process resource profiling.
  mutate-profile:
    extends:
      service: mutate
    container_name: redis-rate-limiter-mutate-profile
    environment:
      MUTMUT_RESOURCE_SNAPSHOT_FILE: /tmp/mutmut_resource_snapshot.jsonl
    command: >-
      bash -c "
        find /app/mutants -mindepth 1 -delete;
        python scripts/run_mutmut.py run --max-children $$(( $$(nproc) - 4 )) 2>&1 | tee /tmp/mutmut-run.log;
        MUTMUT_EXIT=$${PIPESTATUS[0]};
        if [ $$MUTMUT_EXIT -ne 0 ]; then
          echo '*** BASELINE FAILURE: mutmut run exited with code '$$MUTMUT_EXIT' ***';
          echo 'Re-running test suite to capture the failing test:';
          python -m pytest -x --tb=short -q --ignore=tests/properties/ --deselect=tests/integration/test_rate_limiting.py::TestSlidingWindowBehavior --deselect=tests/integration/test_distributed_rate_limiting.py::TestDistributedRateLimiting;
          exit 1;
        fi;
        python scripts/generate_mutmut_report.py --log /tmp/mutmut-run.log --output-dir /app/mutation-output --killed-by /tmp/mutmut_killed_by_results.json;
        cp /tmp/mutmut_resource_snapshot.jsonl /app/mutation-output/ 2>/dev/null || true
      "
    profiles:
      - mutate-profile

  # Memory analysis service (runs a representative test subset with /proc/self/status sampling).
  memory-profile:
    <<: *test-base
    container_name: redis-rate-limiter-memory-profile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
      MEMORY_PROFILE_FILE: /app/memory-output/memory-profile.jsonl
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./memory-results:/app/memory-output
    command: poetry run pytest tests/ -v -s
    profiles:
      - memory-profile

  # Superfluity analysis service (runs per-file mutation testing without -x).
  superfluity:
    <<: *test-base
    container_name: redis-rate-limiter-superfluity
    volumes:
      - ./mutmut-results:/app/mutation-output
    deploy:
      resources:
        limits:
#          memory: 6g
          cpus: "12"
    command: >-
      python scripts/analyze_superfluity.py --all --output-dir /app/mutation-output
    profiles:
      - superfluity

  # Benchmark runner service.
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
      target: benchmark
    container_name: redis-rate-limiter-benchmark
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
      SOAK_DURATION: "${SOAK_DURATION:-60}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./benchmark-results:/app/.benchmarks
    command: >-
      bash -c "
        poetry run pytest benchmarks/ -v -s --benchmark-max-time=5.0 --benchmark-warmup=on --benchmark-autosave &&
        python scripts/benchmark_report.py .benchmarks
      "
    networks:
      - rate-limiter-network
    profiles:
      - benchmark

  # Free-threaded Python 3.14 contention benchmark (PEP 703 / no-GIL).
  # Run with: docker compose --profile benchmark-ft up --build --abort-on-container-exit --exit-code-from benchmark-ft
  benchmark-ft:
    build:
      context: .
      dockerfile: Dockerfile.freethreaded
    container_name: redis-rate-limiter-benchmark-ft
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
      PYTHON_GIL: "0"
    depends_on:
      redis:
        condition: service_healthy
    command: >-
      bash -c "
        python -c 'import sys; print(\"free-threaded:\", not sys._is_gil_enabled())' &&
        pytest benchmarks/test_contention.py -v -s --benchmark-max-time=5.0 --benchmark-warmup=on
      "
    networks:
      - rate-limiter-network
    profiles:
      - benchmark-ft

  # Optional: Redis Commander (web UI for debugging).
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-rate-limiter-redis-ui
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rate-limiter-network
    profiles:
      # Only start with: docker-compose --profile debug up.
      - debug

volumes:
  redis-data:
    driver: local

networks:
  rate-limiter-network:
    driver: bridge
