name: Mutation Testing

on:
  # Update the badge when mutation results are pushed to master.
  push:
    branches: [master]
    paths:
      - "mutmut-results/mutation-score.txt"
  # Manual trigger: run mutation testing on CI (for future use when the
  # repository is public and runners have sufficient resources).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Update the badge from committed local mutation testing results.
  update-badge:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read Mutation Score
        id: score
        run: |
          SCORE=$(cat mutmut-results/mutation-score.txt)
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "Mutation score: ${SCORE}%"

      - name: Update Mutation Score Badge
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f3caa8f0af98bf11563b5b2031c1ef3e
          filename: redis-rate-limiter-mutation-score.json
          label: Mutation Score
          message: ${{ steps.score.outputs.score }}%
          valColorRange: ${{ steps.score.outputs.score }}
          maxColorRange: 100
          minColorRange: 0

  # Run mutation testing on CI (manual trigger only).
  mutate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure Kernel for Redis
        run: sudo sysctl vm.overcommit_memory=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Run Mutation Tests
        run: >
          docker compose --profile mutate up
          --build
          --abort-on-container-exit
          --exit-code-from mutate

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: mutmut-results
          path: mutmut-results/

      - name: Extract Mutation Score
        id: mutation_score
        if: success()
        run: |
          SCORE=$(cat mutmut-results/mutation-score.txt)
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "Mutation score: ${SCORE}%"

      - name: Update Mutation Score Badge
        if: success()
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f3caa8f0af98bf11563b5b2031c1ef3e
          filename: redis-rate-limiter-mutation-score.json
          label: Mutation Score
          message: ${{ steps.mutation_score.outputs.score }}%
          valColorRange: ${{ steps.mutation_score.outputs.score }}
          maxColorRange: 100
          minColorRange: 0
