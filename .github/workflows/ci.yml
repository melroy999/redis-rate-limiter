name: CI Pipeline

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/redis-rate-limiter
  TAG: ${{ github.ref_name == 'master' && 'latest' || 'dev' }}

jobs:
  # Lint check; soft fail (i.e. warning) if not master branch.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.ref_name != 'master' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-poetry

      - name: Ruff Check (Lint)
        run: poetry run ruff check .

  # Type check.
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-poetry

      - name: Mypy (Types)
        run: poetry run mypy src
  # Run tests and report findings.
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Ensure vm.overcommit_memory is set--not strictly necessary, but redis prefers it is on.
      - name: Configure Kernel for Redis
        run: sudo sysctl vm.overcommit_memory=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Test Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: test
          load: true
          tags: app-test
          # Using the GHA cache type allows Docker to store layers
          # directly in the GitHub Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the tests--this requires the redis server to run--'|| true' ensures a clean shutdown even if redis crashes.
      # The '--override-ini' clears the default slow test exclusion from pyproject.toml,
      # ensuring all tests (including slow parameterized tests) run in CI.
      - name: Run Pytest in Container
        run: |
          docker run --name test-container app-test \
          sh -c "redis-server --daemonize yes && PYTHONPATH=src python3 -m pytest --override-ini='addopts=--import-mode=importlib' --junitxml=result.xml --cov=src/redis_rate_limiter --cov-report=xml:coverage.xml tests/ && redis-cli shutdown || true"

      - name: Extract Artifacts
        if: always()
        run: |
          docker cp test-container:/app/result.xml ./result.xml || true
          docker cp test-container:/app/coverage.xml ./coverage.xml || true
          docker rm test-container

      - name: Upload Test Results
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: |
            result.xml
            coverage.xml
          retention-days: 7

      - name: Check Coverage Threshold
        id: coverage_check
        shell: python
        env:
          MIN_COVERAGE: ${{ github.ref_name == 'master' && 90 || 70 }}
        run: |
          import xml.etree.ElementTree as ET
          import os, sys
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              coverage = float(root.attrib['line-rate']) * 100
              threshold = float(os.getenv('MIN_COVERAGE'))
   
              print(f"Current Coverage: {coverage:.2f}% | Required: {threshold}%")
              
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"perc={coverage:.2f}\n")

              if coverage < threshold:
                  print(f"FAILED: Coverage below {threshold}%")
                  sys.exit(1)
          except Exception as e:
              print(f"Error parsing coverage: {e}")
              sys.exit(1)

      - name: Update Coverage Badge
        if: ${{ github.ref_name == 'master' }}
        uses: schneegans/dynamic-badges-action@0e50b8bad39e7e1afd3e4e9c2b7dd145fad07501 # v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f3caa8f0af98bf11563b5b2031c1ef3e
          filename: redis-rate-limiter-coverage.json
          label: Coverage
          message: ${{ steps.coverage_check.outputs.perc }}%
          valColorRange: ${{ steps.coverage_check.outputs.perc }}
          maxColorRange: 100
          minColorRange: 0

      - name: Update CI Badge (passing)
        if: ${{ github.ref_name == 'master' && success() }}
        uses: schneegans/dynamic-badges-action@0e50b8bad39e7e1afd3e4e9c2b7dd145fad07501 # v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f3caa8f0af98bf11563b5b2031c1ef3e
          filename: redis-rate-limiter-ci.json
          label: CI
          message: passing
          color: brightgreen

      - name: Update CI Badge (failing)
        if: ${{ github.ref_name == 'master' && failure() }}
        uses: schneegans/dynamic-badges-action@0e50b8bad39e7e1afd3e4e9c2b7dd145fad07501 # v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f3caa8f0af98bf11563b5b2031c1ef3e
          filename: redis-rate-limiter-ci.json
          label: CI
          message: failing
          color: red

  # Build the project and push the docker image.
  build-and-push:
    needs: test-and-report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Run only iff test-and-report passed.
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build the production image and verify that it is not tainted by dev artifacts.
      - name: Build Production Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          # Using the GHA cache type allows Docker to store layers
          # directly in the GitHub Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Final Image
        run: |
          if docker run --rm ${{ env.IMAGE_NAME }}:${{ env.TAG }} pip list | grep -E "pytest|fakeredis"; then
            echo "Error: Dev dependencies leaked into production stage!"
            exit 1
          fi

      - name: Run Trivy Security Scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.TAG }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          version: 'v0.69.2'

          # Fail if there is a vulnerability with an update.
          ignore-unfixed: true
          exit-code: '1'

      - name: Push Production Image
        if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.TAG }}

  # Auto-cleanup files in the GHCR registry.
  cleanup-registry:
    needs: build-and-push
    permissions:
      packages: write
    # Always run cleanup on push events, even if build-and-push failed.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Prune Old Images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: 'redis-rate-limiter'
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'true'
