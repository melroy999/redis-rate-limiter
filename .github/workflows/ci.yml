name: CI Pipeline

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/celery-rate-limiter
  TAG: ${{ github.ref_name == 'master' && 'latest' || 'dev' }}

jobs:
  # Check code quality.
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install Dependencies
        run: poetry install

      # Soft fail (i.e. warning) if not master branch.
      - name: Ruff Check (Lint)
        continue-on-error: ${{ github.ref_name != 'master' }}
        run: poetry run ruff check .

      - name: Mypy (Types)
        run: poetry run mypy src

  # Run tests and report findings.
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Ensure vm.overcommit_memory is set--not strictly necessary, but redis prefers it is on.
      - name: Configure Kernel for Redis
        run: sudo sysctl vm.overcommit_memory=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: app-test
          # Using the GHA cache type allows Docker to store layers
          # directly in the GitHub Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the tests--this requires the redis server to run--'|| true' ensures a clean shutdown even if redis crashes.
      # The '--override-ini' clears the default slow test exclusion from pyproject.toml,
      # ensuring all tests (including slow parameterized tests) run in CI.
      - name: Run Pytest in Container
        run: |
          docker run --name test-container app-test \
          sh -c "redis-server --daemonize yes && PYTHONPATH=src python3 -m pytest --override-ini='addopts=--import-mode=importlib' --junitxml=result.xml --cov=src/celery_rate_limiter --cov-report=xml:coverage.xml tests/ && redis-cli shutdown || true"

      - name: Extract Artifacts
        if: always()
        run: |
          docker cp test-container:/app/result.xml ./result.xml || true
          docker cp test-container:/app/coverage.xml ./coverage.xml || true
          docker rm test-container

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: |
            result.xml
            coverage.xml

      - name: Check Coverage Threshold
        id: coverage_check
        shell: python
        env:
          MIN_COVERAGE: ${{ github.ref_name == 'master' && 90 || 70 }}
        run: |
          import xml.etree.ElementTree as ET
          import os, sys
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              coverage = float(root.attrib['line-rate']) * 100
              threshold = float(os.getenv('MIN_COVERAGE'))
   
              print(f"Current Coverage: {coverage:.2f}% | Required: {threshold}%")
              
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"perc={coverage:.2f}\n")

              if coverage < threshold:
                  print(f"FAILED: Coverage below {threshold}%")
                  sys.exit(1)
          except Exception as e:
              print(f"Error parsing coverage: {e}")
              sys.exit(1)

      - name: Update Coverage Badge
        if: ${{ github.ref_name == 'master' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f3caa8f0af98bf11563b5b2031c1ef3e
          filename: celery-rate-limiter-coverage.json
          label: Coverage
          message: ${{ steps.coverage_check.outputs.perc }}%
          valColorRange: ${{ steps.coverage_check.outputs.perc }}
          maxColorRange: 100
          minColorRange: 0

      - name: Update CI Badge (passing)
        if: ${{ github.ref_name == 'master' && success() }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f3caa8f0af98bf11563b5b2031c1ef3e
          filename: celery-rate-limiter-ci.json
          label: CI
          message: passing
          color: brightgreen

      - name: Update CI Badge (failing)
        if: ${{ github.ref_name == 'master' && failure() }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f3caa8f0af98bf11563b5b2031c1ef3e
          filename: celery-rate-limiter-ci.json
          label: CI
          message: failing
          color: red

  # Build the project and push the docker image.
  build-and-push:
    needs: test-and-report
    runs-on: ubuntu-latest
    # Run only iff test-and-report passed.
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the production image and verify that it is not tainted by dev artifacts.
      - name: Build Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          # Using the GHA cache type allows Docker to store layers
          # directly in the GitHub Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Final Image
        run: |
          if docker run --rm ${{ env.IMAGE_NAME }}:${{ env.TAG }} pip list | grep -E "pytest|fakeredis"; then
            echo "Error: Dev dependencies leaked into production stage!"
            exit 1
          fi

      - name: Run Trivy Security Scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@0.34.1
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.TAG }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'

          # Fail if there is a vulnerability with an update.
          ignore-unfixed: true
          exit-code: '1'

      - name: Push Production Image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.TAG }}

  # Auto-cleanup files in the GHCR registry.
  cleanup-registry:
    needs: build-and-push
    # Always run cleanup, even if previous steps failed.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Prune Old Images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'celery-rate-limiter'
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'true'