name: "Setup Poetry"
description: "Install Poetry, set up Python, and install dependencies. Requires actions/checkout first."

runs:
  using: "composite"
  steps:
    - name: Install Poetry
      shell: bash
      run: pipx install poetry==2.3.1

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'
        cache: 'poetry'

    - name: Install Dependencies
      shell: bash
      run: poetry install
