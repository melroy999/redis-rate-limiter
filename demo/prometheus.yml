# Prometheus scrape configuration for the Docker Compose demonstration.
#
# A 1-second scrape interval provides near-real-time dashboard updates,
# matching the 1-second rate limit window for maximum granularity.

global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: celery-rate-limiter
    static_configs:
      - targets:
          - generator:8000
          - worker-1:8000
          - worker-2:8000
          - worker-3:8000
    relabel_configs:
      # Strip the port from the instance label so Grafana legends show
      # clean names like "worker-1" instead of "worker-1:8000".
      - source_labels: [__address__]
        regex: "(.+):\\d+"
        target_label: instance
        replacement: "$1"
