# Prometheus deployment and ClusterIP service: scrapes /metrics from all
# annotated pods every second and serves the query API on port 9090. The
# scrape configuration is mounted from the prometheus-config ConfigMap.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: celery-rate-limiter-demo
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: celery-rate-limiter-demo
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
