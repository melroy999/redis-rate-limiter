# Grafana dashboard ConfigMap: contains the pre-built dashboard JSON that
# visualises offered vs consumed rate, buffer depth, per-worker load
# distribution, remaining tokens, and consume outcomes. Provisioned
# automatically by the dashboard provider on startup.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: redis-rate-limiter-demo
binaryData: {}
data:
  dashboard.json: |
    {
      "annotations": { "list": [] },
      "description": "Distributed rate limiter demonstration: sine-wave traffic, Prometheus metrics, and live rate limiting visualization.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Offered vs Consumed Rate",
          "description": "The theoretical sine-wave offered rate versus the actual rate at which the generator schedules tasks, and the consumed rate as seen by workers.",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisLabel": "tasks/sec",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": { "mode": "off" }
              },
              "unit": "ops"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Offered Rate" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } },
                  { "id": "custom.lineStyle", "value": { "dash": [10, 10], "fill": "dash" } },
                  { "id": "custom.fillOpacity", "value": 5 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Actual Offered Rate" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "light-blue", "mode": "fixed" } },
                  { "id": "custom.fillOpacity", "value": 10 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Consumed Rate" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } },
                  { "id": "custom.fillOpacity", "value": 15 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Rate Limit" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } },
                  { "id": "custom.lineStyle", "value": { "dash": [10, 10], "fill": "dash" } },
                  { "id": "custom.lineWidth", "value": 2 },
                  { "id": "custom.fillOpacity", "value": 0 }
                ]
              }
            ]
          },
          "options": {
            "legend": { "calcs": ["min", "mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "redis_rate_limiter_demo_offered_rate{limiter_id=\"$limiter_id\"}", "legendFormat": "Offered Rate", "interval": "1s", "refId": "A" },
            { "expr": "sum(rate(redis_rate_limiter_demo_tasks_scheduled_total{limiter_id=\"$limiter_id\"}[2s]))", "legendFormat": "Actual Offered Rate", "interval": "1s", "refId": "B" },
            { "expr": "sum(rate(redis_rate_limiter_consume_total{limiter_id=\"$limiter_id\", outcome=\"success\"}[2s]))", "legendFormat": "Consumed Rate", "interval": "1s", "refId": "C" },
            { "expr": "max(redis_rate_limiter_demo_effective_rate{limiter_id=\"$limiter_id\"})", "legendFormat": "Rate Limit", "interval": "1s", "refId": "D" }
          ],
          "datasource": { "type": "prometheus", "uid": "${datasource}" }
        },
        {
          "title": "Buffer Depth",
          "description": "Number of tasks waiting in the buffer.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisLabel": "tasks", "drawStyle": "line", "fillOpacity": 20, "lineInterpolation": "smooth", "lineWidth": 2, "showPoints": "never", "spanNulls": true },
              "min": 0, "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["min", "mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "max(redis_rate_limiter_buffer_depth{limiter_id=\"$limiter_id\"})", "legendFormat": "Buffer Depth", "interval": "1s", "refId": "A" }
          ],
          "datasource": { "type": "prometheus", "uid": "${datasource}" }
        },
        {
          "title": "Per-Worker Consumed Rate",
          "description": "Consumed tasks per second broken down by worker, showing how the shared rate limit is distributed across pods.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisLabel": "tasks/sec", "drawStyle": "line", "fillOpacity": 15, "lineInterpolation": "smooth", "lineWidth": 2, "showPoints": "never", "spanNulls": true },
              "min": 0,
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["min", "mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "rate(redis_rate_limiter_demo_tasks_executed_total{limiter_id=\"$limiter_id\"}[2s])", "legendFormat": "{{instance}}", "interval": "1s", "refId": "A" }
          ],
          "datasource": { "type": "prometheus", "uid": "${datasource}" }
        },
        {
          "title": "Remaining Rate Limit Tokens",
          "description": "Tokens remaining in the current sliding window.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisLabel": "tokens", "drawStyle": "line", "fillOpacity": 10, "lineInterpolation": "smooth", "lineWidth": 2, "showPoints": "never", "spanNulls": true },
              "min": 0, "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["min", "mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "min(redis_rate_limiter_remaining_tokens{limiter_id=\"$limiter_id\"})", "legendFormat": "Remaining Tokens", "interval": "1s", "refId": "A" }
          ],
          "datasource": { "type": "prometheus", "uid": "${datasource}" }
        },
        {
          "title": "Consume Outcomes",
          "description": "Breakdown of consume operations by outcome.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisLabel": "events/sec", "drawStyle": "bars", "fillOpacity": 80, "lineWidth": 0, "showPoints": "never", "stacking": { "group": "A", "mode": "normal" } },
              "unit": "ops"
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "success" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "rejected" }, "properties": [{ "id": "color", "value": { "fixedColor": "yellow", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "expired" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] }
            ]
          },
          "options": {
            "legend": { "calcs": ["min", "mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "sum by (outcome) (rate(redis_rate_limiter_consume_total{limiter_id=\"$limiter_id\"}[2s]))", "legendFormat": "{{outcome}}", "interval": "1s", "refId": "A" }
          ],
          "datasource": { "type": "prometheus", "uid": "${datasource}" }
        }
      ],
      "liveNow": true,
      "refresh": "1s",
      "schemaVersion": 39,
      "tags": ["rate-limiter", "demo"],
      "templating": {
        "list": [
          { "current": { "selected": false, "text": "Prometheus", "value": "prometheus" }, "hide": 0, "includeAll": false, "multi": false, "name": "datasource", "options": [], "query": "prometheus", "refresh": 1, "type": "datasource" },
          { "current": { "selected": false, "text": "k8s-demo", "value": "k8s-demo" }, "hide": 0, "includeAll": false, "multi": false, "name": "limiter_id", "options": [{ "selected": true, "text": "k8s-demo", "value": "k8s-demo" }], "query": "k8s-demo", "type": "custom" }
        ]
      },
      "time": { "from": "now-5m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Distributed Rate Limiter Demo",
      "uid": "redis-rate-limiter-demo",
      "version": 1
    }
