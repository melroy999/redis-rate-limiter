# Redis deployment and ClusterIP service: shared backend for all rate limiter
# state (sliding window counters, task buffer, concurrency tracking, Pub/Sub
# drain signals). Persistence is disabled (no AOF, no RDB snapshots) since
# the demo state is ephemeral.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis-rate-limiter-demo
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis-rate-limiter-demo
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
