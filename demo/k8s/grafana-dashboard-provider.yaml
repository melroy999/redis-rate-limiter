# Grafana dashboard provider ConfigMap: tells Grafana to load dashboard JSON
# files from the mounted directory. The updateIntervalSeconds of 10 controls
# how often Grafana re-reads dashboard.json from disk.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: redis-rate-limiter-demo
data:
  default.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
