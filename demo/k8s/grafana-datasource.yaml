# Grafana datasource provisioning ConfigMap: auto-configures Prometheus as the
# default datasource on startup. The timeInterval of 1s matches the Prometheus
# scrape interval for accurate rate() calculations.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: celery-rate-limiter-demo
data:
  prometheus.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "1s"
