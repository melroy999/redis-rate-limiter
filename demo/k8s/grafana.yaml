# Grafana deployment and NodePort service: pre-provisioned with the Prometheus
# datasource and the demo dashboard via ConfigMap volume mounts. Anonymous
# admin access is enabled so the dashboard loads without login. Exposed on
# NodePort 30000, mapped to the host via kind extraPortMappings or minikube
# port-forward (see demo/scripts/setup.sh).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: redis-rate-limiter-demo
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_DASHBOARDS_MIN_REFRESH_INTERVAL
              value: 1s
            - name: GF_USERS_HOME_PAGE
              value: /d/redis-rate-limiter-demo/distributed-rate-limiter-demo
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yaml
              subPath: prometheus.yaml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/default.yaml
              subPath: default.yaml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/dashboard.json
              subPath: dashboard.json
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: redis-rate-limiter-demo
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
