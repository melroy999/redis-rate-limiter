# Docker Compose demonstration of the distributed rate limiter.
#
# Usage:
#   cd demo && docker compose up --build
#   Open http://localhost:${GRAFANA_PORT:-3001} for the Grafana dashboard.
#   Press Ctrl+C to stop.

services:
  # Shared Redis backend for rate limiter state.
  redis:
    image: redis:7-alpine
    container_name: demo-redis
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - demo

  # Traffic generator: schedules tasks at a sine-wave rate.
  generator:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: demo-generator
    environment:
      REDIS_HOST: redis
      TRAFFIC_GENERATOR: "true"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - demo

  # Worker replicas: consume and execute tasks from the shared buffer.
  worker-1:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: demo-worker-1
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - demo

  worker-2:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: demo-worker-2
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - demo

  worker-3:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: demo-worker-3
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - demo

  # Prometheus: scrapes metrics from all demo pods.
  prometheus:
    image: prom/prometheus:latest
    container_name: demo-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - generator
      - worker-1
      - worker-2
      - worker-3
    networks:
      - demo

  # Grafana: pre-provisioned with Prometheus datasource and dashboard.
  grafana:
    image: grafana/grafana:latest
    container_name: demo-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_USERS_HOME_PAGE: /d/redis-rate-limiter-demo/distributed-rate-limiter-demo
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - demo

networks:
  demo:
    driver: bridge
