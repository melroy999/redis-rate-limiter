[project]
name = "redis-rate-limiter"
version = "0.3.0"
description = ""
authors = [
    {name = "melroy999",email = "9898970+melroy999@users.noreply.github.com"}
]
requires-python = ">=3.12"
dependencies = [
    "redis (>=7.1.0,<7.2.0)",
]

[project.optional-dependencies]
celery = ["celery (>=5.6.2,<5.7.0)"]
rq = ["rq (>=2.8.0,<3.0.0)"]
dramatiq = ["dramatiq[redis] (>=2.0.0,<3.0.0)"]
huey = ["huey (>=2.5.0,<3.0.0)"]
prometheus = ["prometheus_client (>=0.21.0,<1.0.0)"]
asgi = ["fastapi (>=0.115.0)", "uvicorn (>=0.34.0)"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2"
pytest-asyncio = ">=0.25.0"
pytest_cov = ">=7.0.0"
ruff = "^0.15.9"
mypy = "^1.20.0"
hypothesis = "^6.151.10"
mutmut = {version = "^3.5.0", python = "<4.0"}
pytest-timeout = ">=2.3.0"

[tool.poetry]
packages = [{include = "redis_rate_limiter", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["src/redis_rate_limiter"]
concurrency = ["thread"]
dynamic_context = "test_function"

[tool.pytest.ini_options]
# Exclude slow tests by default. Run with: pytest -m slow (or pytest --run-slow).
addopts = "-m 'not slow' --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (use real time.sleep, multiple configurations). Run explicitly with: pytest -m slow",
    "behavior: tests functional correctness",
    "observability: tests logging, metrics, callbacks",
    "signature: tests method/API signatures and default values",
    "contract: runs a shared contract suite against a specific backend",
    "concurrency: tests thread/process safety",
    "timeout_safety_net: tests with bounded shutdown mechanisms that should run first under mutmut -x",
]

[tool.mutmut]
paths_to_mutate = ["src/redis_rate_limiter/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = [
    "--tb=short", "-q",
    "--ignore=tests/properties/",
    "--deselect=tests/integration/test_rate_limiting.py::TestSlidingWindowBehavior",
    "--deselect=tests/integration/test_distributed_rate_limiting.py::TestDistributedRateLimiting",
    "--deselect=tests/implementations/test_concurrent_access.py",
]
do_not_mutate = [
    "**/__init__.py",
]
