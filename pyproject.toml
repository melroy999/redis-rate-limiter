[project]
name = "celery-rate-limiter"
version = "0.1.0"
description = ""
authors = [
    {name = "melroy999",email = "9898970+melroy999@users.noreply.github.com"}
]
requires-python = ">=3.12"
dependencies = [
    "celery (>=5.6.2,<5.7.0)",
    "redis (>=7.1.0,<7.2.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2"
pytest_cov = ">=7.0.0"
fakeredis = ">=2.33.0"
ruff = "^0.14.14"
mypy = "^1.19.1"
hypothesis = "^6.151.4"

[tool.poetry]
packages = [{include = "celery_rate_limiter", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["src/celery_rate_limiter"]

[tool.pytest.ini_options]
# Exclude slow tests by default. Run with: pytest -m slow (or pytest --run-slow).
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (use real time.sleep, multiple configurations). Run explicitly with: pytest -m slow",
]
